[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "https://go.thepastorshelper.com/*"
  to = "https://thepastorshelper.com/sales/:splat"
  status = 301
  force = true

[functions]
  timeout = 60
